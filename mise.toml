[tools]
bun = "1.4"
rust = "stable"
# The sqlx CLI migrates the schema database the committed query cache is generated from. Remove this
# tool and `mise run db:schema` / `sqlx:prepare` / `sqlx:check` stop working.
"cargo:sqlx-cli" = "0.9"

[tasks."api:gen"]
description = "Regenerate OpenAPI and Orval client"
run = "bun run api:gen"

[tasks."db:schema"]
description = "Rebuild the schema database the sqlx query cache is generated from"
dir = "server"
run = '''
db="${XDG_STATE_HOME:-$HOME/.local/state}/adhocly/schema.db"
mkdir -p "$(dirname "$db")"
rm -f "$db"
DATABASE_URL="sqlite://$db?mode=rwc" cargo sqlx migrate run
# cargo cannot see that the schema changed, and `cargo sqlx prepare` only collects the queries it
# actually re-expands, so force the next compile to re-run them.
touch src/main.rs
'''

[tasks."sqlx:prepare"]
description = "Regenerate the committed offline query cache after changing SQL"
dir = "server"
depends = ["db:schema"]
run = '''
db="${XDG_STATE_HOME:-$HOME/.local/state}/adhocly/schema.db"
rm -rf .sqlx
# The cache is generated from a live database, so override the offline default from .cargo/config.toml.
SQLX_OFFLINE=false DATABASE_URL="sqlite://$db" cargo sqlx prepare
'''

[tasks."sqlx:check"]
description = "Verify the committed query cache still matches the migrations"
dir = "server"
depends = ["db:schema"]
run = '''
db="${XDG_STATE_HOME:-$HOME/.local/state}/adhocly/schema.db"
SQLX_OFFLINE=false DATABASE_URL="sqlite://$db" cargo sqlx prepare --check
'''

[tasks.test]
description = "Run the server test suite"
dir = "server"
depends = ["sqlx:check"]
run = "cargo test"

[tasks."api:serve"]
description = "Run the SQLite API"
dir = "server"
run = '''
db_dir="${XDG_STATE_HOME:-$HOME/.local/state}/adhocly"
db="$db_dir/adhocly.db"
mkdir -p "$db_dir"
[ -f "$db" ] || [ ! -f adhocly.db ] || cp adhocly.db "$db"
export DATABASE_URL="sqlite://$db?mode=rwc"
# Migrate before compiling: the query_file! macros introspect DATABASE_URL, so a fresh database
# cannot build without its schema in place. sqlx-cli also records the migration bookkeeping.
cargo sqlx migrate run
cargo run
'''

[tasks."api:docs"]
description = "Serve the OpenAPI spec as Scalar API docs on http://localhost:3001"
dir = "server"
run = "bunx @scalar/cli@2 document serve openapi.json --watch --port 3001"

[tasks.server]
description = "Run the SQLite API and its Scalar API docs"
run = "mise run api:serve ::: api:docs"

[tasks."mobile:ios"]
description = "Build and run the SwiftUI app in the iOS Simulator"
run = '''
device="${IOS_DEVICE:-iPhone 17}"
xcrun simctl boot "$device" 2>/dev/null || true
xcrun simctl bootstatus "$device" -b
xcodebuild -project apple/Adhocly.xcodeproj -scheme Adhocly \
  -destination "platform=iOS Simulator,name=$device" \
  -derivedDataPath apple/DerivedData CODE_SIGNING_ALLOWED=NO build
xcrun simctl install "$device" apple/DerivedData/Build/Products/Debug-iphonesimulator/Adhocly.app
xcrun simctl launch "$device" com.adhocly.app
'''

[tasks."desktop:macos"]
description = "Build and run the SwiftUI app on macOS"
run = '''
xcodebuild -project apple/Adhocly.xcodeproj -scheme Adhocly \
  -destination 'platform=macOS' -derivedDataPath apple/DerivedData \
  CODE_SIGNING_ALLOWED=NO build
open apple/DerivedData/Build/Products/Debug/Adhocly.app
'''

[tasks."apple:test"]
description = "Test offline persistence and the Swift sync client"
run = "swift test --package-path apple"

[tasks."apple:integration"]
description = "Test the Swift client against an isolated Rust server and temporary database"
run = "apple/scripts/test-integration.sh"

[tasks.dev]
description = "Run the API and iOS app together"
run = "mise run server ::: mobile:ios"

[tasks."dev:macos"]
description = "Run the API and macOS app together"
run = "mise run api:serve ::: desktop:macos"
