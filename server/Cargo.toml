[package]
name = "adhocly-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.4"
percent-encoding = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros", "derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
utoipa = { version = "5", features = ["macros"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v7"] }
